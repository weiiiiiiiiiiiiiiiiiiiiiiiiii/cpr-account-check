[package]
name = "cpr-account-check"
version = "0.1.2"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[dependencies]
gateway-plugin-sdk = { path = "../vendor/gateway-plugin-sdk", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
regex = "1.12.3"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt", "sync", "time"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
